services:
  - type: web
    name: lineforge
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: GEMINI_IMAGE_SIZE
        value: 2K
